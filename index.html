<title>내 옷장 · 바지</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#222;--sub:#777;--ac:#2f4a6d;--ln:#e5e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--tx:#eee;--sub:#999;--ac:#8fb0dd;--ln:#34363a}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--tx:#eee;--sub:#999;--ac:#8fb0dd;--ln:#34363a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:14px}
h1{font-size:20px;margin:4px 0 10px}
h2{font-size:15px;margin:18px 0 8px;color:var(--ac)}
h2 small{color:var(--sub);font-weight:400}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ln)}
.btn.r{background:transparent;color:#d33;border:1px solid var(--ln)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chip{white-space:nowrap;border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:5px 12px}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden;text-align:center;cursor:pointer}
.it .im{aspect-ratio:3/4;background:var(--ln);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.it img{width:100%;height:100%;object-fit:contain;display:block}
.it b{display:block;padding:5px 2px 0;font-size:14px;letter-spacing:.5px}
.it span{display:block;padding:0 2px 6px;font-size:11px;color:var(--sub)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
.mod.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two{align-items:start}.two>img{width:100%;height:auto;border-radius:10px;display:block}.slot{width:100%;aspect-ratio:3/4;border-radius:10px;background:var(--ln)}
.slot{display:flex;align-items:center;justify-content:center;color:var(--sub);text-align:center;cursor:pointer;overflow:hidden;font-size:13px}
.slot img{width:100%;height:100%;object-fit:contain}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 3px}
select,input[type=text],textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--card)}
textarea{min-height:80px}
.code{font-size:26px;font-weight:800;color:var(--ac);margin:6px 0 0}
.kv{margin:8px 0;white-space:pre-wrap}
canvas{width:100%;touch-action:none;border-radius:8px;display:block}
.leg{font-size:12px;color:var(--sub);margin-top:22px;line-height:1.7}
.rate{display:flex;gap:6px}.rate button{flex:1;padding:10px 0;border:1px solid var(--ln);border-radius:8px;background:var(--card)}.rate button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}.rl{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:3px}
[hidden]{display:none!important}.tabs{display:flex;gap:6px;margin:4px 0 8px}.tabs .chip{flex:1;text-align:center}.fp{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-top:8px}
.top{flex-wrap:nowrap}.top .btn{padding:9px 10px;font-size:14px;white-space:nowrap}
.nv{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:12px;color:var(--sub);text-align:center}.nv .btn{padding:2px 14px;font-size:20px}
@keyframes inr{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}@keyframes inl{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
</style></head><body>

const CATS={
 pants:{n:'바지',pre:'',colors:{'연청':'L','중청':'M','진청':'D','흑/먹색':'K','기타':'E'},fits:{'와이드':'W','세미와이드':'SW','일자':'S','부츠컷':'B','테이퍼드':'T','스키니':'SK','기타':'E'},ex:'DW01 = 진청 와이드 1번'},
 top:{n:'상의',pre:'T',colors:CK,fits:{'티셔츠':'TS','셔츠':'SH','니트':'KN','맨투맨':'MT','후디':'HD','기타':'E'},ex:'TWTS01 = 상의 화이트 티셔츠 1번'},
 outer:{n:'아우터',pre:'O',colors:CK,fits:{'자켓':'JK','코트':'CT','패딩':'PD','가디건':'CD','점퍼':'JP','기타':'E'},ex:'OKJK01 = 아우터 블랙 자켓 1번'}
};
const THICK=['얇음','중간','두꺼움'],LEN=['짧음','적당','김'],WAIST=['하이','미드','로우'],SIZES=['-','작음','잘맞음','큼'],STORE=['접기','걸기'],SEAS=['봄가을','여름','겨울'],REP=['없음','필요'],OUT=['없음','낮음','보통','높음'];
let ORDER=[],mode=0,curId,db,items=[],flt='전체',grp='color',cat='pants',F={},so='code';
const $=id=>document.getElementById(id),C=()=>CATS[cat],M=()=>grp==='color'?C().colors:C().fits;
const ct=i=>i.cat||'pants',lw=i=>(i.wears||[]).slice(-1)[0]||'';
function open(){return new Promise(r=>{try{const q=indexedDB.open('closet',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function loadAll(){return new Promise(r=>{if(!db)return r([]);try{const q=db.transaction('p').objectStore('p').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}})}
function put(o){try{db&&db.transaction('p','readwrite').objectStore('p').put(o)}catch(e){}}
function rm(id){try{db&&db.transaction('p','readwrite').objectStore('p').delete(id)}catch(e){}}
function nextCode(k,c,f,skip){const T=CATS[k],p=T.pre+T.colors[c]+T.fits[f];let n=1;const used=items.filter(i=>i.id!==skip&&ct(i)===k&&i.code.replace(/\d+$/,'')===p).map(i=>+i.code.match(/\d+$/)[0]);while(used.includes(n))n++;return p+String(n).padStart(2,'0')}
const pass=i=>(!F.q||(i.code+(i.name||'')+(i.memo||'')).toLowerCase().includes(F.q))&&(!F.waist||i.waist===F.waist)&&(!F.look||(i.look||0)>=F.look)&&(!F.feel||(i.feel||0)>=F.feel)&&(!F.store||i.store===F.store)&&(!F.season||(i.season||[]).includes(F.season))&&(!F.tag||(F.tag==='rep'?i.rep==='필요':!!i.out&&i.out!=='없음'));
const key=(a,b)=>so==='look'?(b.look||0)-(a.look||0):so==='feel'?(b.feel||0)-(a.feel||0):so==='old'?lw(a).localeCompare(lw(b)):so==='out'?OUT.indexOf(b.out||'없음')-OUT.indexOf(a.out||'없음'):so==='many'?(b.wears||[]).length-(a.wears||[]).length:0;
const cmp=(a,b)=>key(a,b)||a.code.localeCompare(b.code);
function render(){
 const all=items.filter(i=>ct(i)===cat),list=all.filter(pass),keys=Object.keys(M());
 $('cnt').textContent=all.length+'벌'+(list.length!==all.length?` (조건 ${list.length})`:'');
 $('tabs').innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="chip ${k===cat?'on':''}" data-k="${k}">${v.n} ${items.filter(i=>ct(i)===k).length}</button>`).join('');
 $('add').textContent='+ '+C().n+' 추가';
 $('fw').parentElement.style.display=cat==='pants'?'':'none';
 const cs=['전체',...keys.filter(c=>list.some(i=>i[grp]===c))];
 $('chips').innerHTML=cs.map(c=>`<button class="chip ${c===flt?'on':''}" data-c="${c}">${c}</button>`).join('');
 let h='';ORDER=[];
 for(const c of keys){
  if(flt!=='전체'&&flt!==c)continue;
  const g=list.filter(i=>i[grp]===c).sort(cmp);
  if(!g.length)continue;ORDER.push(...g.map(i=>i.id));
  h+=`<h2>${c} <small>${g.length}벌</small></h2><div class="grid">`+g.map(i=>`<div class="it" data-id="${i.id}"><div class="im">${i.front?`<img src="${i.front}">`:'사진 없음'}</div><b>${i.code}</b><span>${grp==='fit'?i.color:i.fit} · ${i.name||''}${(i.wears||[]).length?' · '+i.wears.length+'회':''}${i.rep==='필요'?' 🔧':''}${i.out&&i.out!=='없음'?' 📤':''}</span></div>`).join('')+'</div>';
 }
 $('list').innerHTML=h||'<p style="color:var(--sub);margin-top:30px;text-align:center">해당하는 옷이 없어요.</p>';
 const T=C(),j=o=>Object.entries(o).map(([k,v])=>`<b>${v}</b>${k}`).join(' · ');
 $('leg').innerHTML=`라벨 규칙: 색 ${j(T.colors)}<br>${cat==='pants'?'핏':'종류'} ${j(T.fits)} + 번호<br>예) ${T.ex}. 이 코드를 안쪽 택에 써 두세요.<br>※ 데이터는 이 브라우저에만 저장돼요. 가끔 '백업'으로 파일을 보관하세요.`;
}
$('tabs').onclick=e=>{const k=e.target.dataset.k;if(k){cat=k;flt='전체';render()}};
$('chips').onclick=e=>{const c=e.target.dataset.c;if(c){flt=c;render()}};
$('list').onclick=e=>{const el=e.target.closest('.it');if(el)detail(el.dataset.id)};
const show=(m,h)=>{$('s'+m.slice(1)).innerHTML=h;$(m).classList.add('on')},hide=m=>{$(m).classList.remove('on');if(m==='m1')mode=0};
const stars=(n,a,b)=>typeof n==='number'?a.repeat(n)+b.repeat(5-n)+` (${n}/5)`:'미입력';
function detail(id,dir){
 mode=1;curId=id;const idx=ORDER.indexOf(id);
 const i=items.find(x=>x.id===id),w=i.wears||[],pants=ct(i)==='pants';
 show('m1',`<div class="nv"><button class="btn g" id="pv">‹</button><span>${idx>=0?(idx+1)+' / '+ORDER.length+' · 옆으로 밀면 이동, 아래로 내리면 닫기':''}</span><button class="btn g" id="nx">›</button></div><div class="two">${['front','side'].map(k=>i[k]?`<img src="${i[k]}">`:'<div class="slot">없음</div>').join('')}</div>
 <div class="code">${i.code}</div><div style="color:var(--sub)">${i.color} ${i.fit}${i.name?' · '+i.name:''}</div>
 <div class="kv">${pants?(i.waist||'허리 미입력')+'웨이스트 · ':''}사이즈: ${i.size&&i.size!=='-'?i.size:'미입력'} · 수납: ${i.store||'미입력'}
착용감: ${stars(i.feel,'●','○')}
핏 예쁨: ${stars(i.look,'★','☆')}
기장: ${i.len}
계절: ${(i.season||[]).join(', ')||'미입력'}${i.rep==='필요'?'\n🔧 수선 필요':''}${i.out&&i.out!=='없음'?'\n📤 방출 우선순위: '+i.out:''}</div><div class="kv">${(i.memo||'').replace(/</g,'&lt;')}</div>
 <div class="kv">착용 ${w.length}회 · 마지막 ${w[w.length-1]||'기록 없음'}</div>
 <div class="bar"><button class="btn" id="wr">✅ 오늘 입음</button><button class="btn g" id="wu">착용 취소</button></div>
 <div class="bar" style="margin-top:12px"><button class="btn" id="ed">수정</button><button class="btn r" id="dl">삭제</button><button class="btn g" id="cl" style="margin-left:auto">닫기</button></div>`);
 $('cl').onclick=()=>hide('m1');$('ed').onclick=()=>{hide('m1');form(i)};
 const go=d=>{const j=idx+d;if(ORDER[j])detail(ORDER[j],d)};$('pv').onclick=()=>go(-1);$('nx').onclick=()=>go(1);
 const sh=$('s1');sh.scrollTop=0;if(dir){sh.style.animation='none';sh.offsetWidth;sh.style.animation=(dir>0?'inr':'inl')+' .22s ease'}
 $('wr').onclick=()=>{const t=new Date().toLocaleDateString('sv-SE');if(w[w.length-1]!==t)w.push(t);i.wears=w;put(i);render();detail(id)};
 $('wu').onclick=()=>{w.pop();i.wears=w;put(i);render();detail(id)};
 $('dl').onclick=()=>{if(confirm(i.code+' 삭제할까요?')){items=items.filter(x=>x.id!==id);rm(id);hide('m1');render()}};
}
const sel=(id,arr,v)=>`<select id="${id}">${arr.map(a=>`<option ${a===v?'selected':''}>${a}</option>`).join('')}</select>`;
const rate=(id,v)=>`<div class="rate" id="${id}">${[1,2,3,4,5].map(n=>`<button data-v="${n}" class="${n===v?'on':''}">${n}</button>`).join('')}</div>`;
function form(old){
 mode=0;
 const k0=old?ct(old):cat,T=CATS[k0];
 const d={id:'p'+Date.now(),cat:k0,color:Object.keys(T.colors)[0],fit:Object.keys(T.fits)[0],thick:'중간',len:'적당',waist:'하이',feel:3,look:3,size:'-',store:'접기',season:[],name:'',memo:'',front:'',side:'',wears:[],...(old||{})};
 d.cat=k0;d.season=d.season||[];if(typeof d.feel!=='number')d.feel=3;if(typeof d.look!=='number')d.look=3;
 show('m1',`<div class="two">${['front','side'].map(k=>`<div><div class="slot" data-k="${k}">${d[k]?`<img src="${d[k]}">`:'📷 '+(k==='front'?'앞':'옆')+' 사진<br>(눌러서 선택)'}</div></div>`).join('')}</div>
 <label>이름/브랜드 (예: 유니클로)</label><input type="text" id="f_name" value="${(d.name||'').replace(/"/g,'&quot;')}">
 <div class="two"><div><label>색</label>${sel('f_color',Object.keys(T.colors),d.color)}</div><div><label>${k0==='pants'?'핏':'종류'}</label>${sel('f_fit',Object.keys(T.fits),d.fit)}</div>
 <div><label>기장</label>${sel('f_len',LEN,d.len)}</div>
 ${k0==='pants'?`<div><label>허리</label>${sel('f_waist',WAIST,d.waist)}</div>`:''}<div><label>사이즈</label>${sel('f_size',SIZES,d.size||'-')}</div><div><label>수납</label>${sel('f_store',STORE,d.store||'접기')}</div><div><label>수선</label>${sel('f_rep',REP,d.rep||'없음')}</div><div><label>방출 우선순위</label>${sel('f_out',OUT,d.out||'없음')}</div></div>
 <label>착용감</label>${rate('f_feel',d.feel)}<div class="rl"><span>불편함</span><span>편함</span></div>
 <label>핏 (예쁜 정도)</label>${rate('f_look',d.look)}<div class="rl"><span>별로</span><span>예쁨</span></div>
 <label>계절</label><div class="rate" id="f_se">${SEAS.map(s=>`<button data-s="${s}" class="${d.season.includes(s)?'on':''}">${s}</button>`).join('')}</div>
 <label>메모 (장단점 등 — 메모앱에서 붙여넣기)</label><textarea id="f_memo">${(d.memo||'').replace(/</g,'&lt;')}</textarea>
 <div class="bar" style="margin-top:12px"><button class="btn" id="sv">저장</button><button class="btn g" id="cl">취소</button></div>`);
 document.querySelectorAll('#s1 .slot').forEach(s=>s.onclick=()=>{
  $('pick').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)cropper(f,url=>{d[s.dataset.k]=url;s.innerHTML=`<img src="${url}">`})};$('pick').click()});
 const bind=(id,k)=>$(id).onclick=e=>{const v=+e.target.dataset.v;if(v){d[k]=v;[...$(id).children].forEach(b=>b.classList.toggle('on',+b.dataset.v===v))}};
 bind('f_feel','feel');bind('f_look','look');
 $('f_se').onclick=e=>{const s=e.target.dataset.s;if(!s)return;d.season=d.season.includes(s)?d.season.filter(x=>x!==s):[...d.season,s];e.target.classList.toggle('on')};
 $('cl').onclick=()=>hide('m1');
 $('sv').onclick=()=>{
  d.name=$('f_name').value.trim();d.color=$('f_color').value;d.fit=$('f_fit').value;d.len=$('f_len').value;if(k0==='pants')d.waist=$('f_waist').value;d.size=$('f_size').value;d.store=$('f_store').value;d.memo=$('f_memo').value;d.rep=$('f_rep').value;d.out=$('f_out').value;
  if(!old||old.color!==d.color||old.fit!==d.fit)d.code=nextCode(k0,d.color,d.fit,d.id);
  const ix=items.findIndex(x=>x.id===d.id);ix>=0?items[ix]=d:items.push(d);put(d);hide('m1');render();
 };
}
$('add').onclick=()=>form();
$('grp').onclick=()=>{grp=grp==='color'?'fit':'color';flt='전체';$('grp').textContent='보기: '+(grp==='color'?'색상별':'종류별');render()};
$('fb').onclick=()=>{$('fp').hidden=!$('fp').hidden};
const ops=a=>a.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
const sc=[['0','전체'],['3','3점 이상'],['4','4점 이상'],['5','5점만']];
$('fw').innerHTML=ops([['','전체'],...WAIST.map(x=>[x,x])]);$('fl').innerHTML=ops(sc);$('ff').innerHTML=ops(sc);
$('fs').innerHTML=ops([['','전체'],...STORE.map(x=>[x,x])]);$('fse').innerHTML=ops([['','전체'],...SEAS.map(x=>[x,x])]);
$('fx').innerHTML=ops([['','전체'],['rep','수선 필요'],['out','방출 후보']]);
$('fso').innerHTML=ops([['code','코드순'],['out','방출 우선순위 높은 순'],['look','핏 예쁜 순'],['feel','착용감 좋은 순'],['old','오래 안 입은 순'],['many','많이 입은 순']]);
function readF(){F={q:$('fq').value.trim().toLowerCase(),waist:$('fw').value,look:+$('fl').value,feel:+$('ff').value,store:$('fs').value,season:$('fse').value,tag:$('fx').value};so=$('fso').value;render()}
['input','change'].forEach(ev=>$('fp').addEventListener(ev,readF));
$('fr').onclick=()=>{$('fq').value='';['fw','fs','fse','fx'].forEach(i=>$(i).value='');['fl','ff'].forEach(i=>$(i).value='0');$('fso').value='code';readF()};

function cropper(file,done){
 const im=new Image();im.onload=()=>{
  const W=Math.min(innerWidth-32,520),sc=W/im.width,H=im.height*sc;
  show('m2',`<div style="font-size:13px;color:var(--sub);margin-bottom:6px">남길 영역을 드래그하세요 (얼굴은 빼고!)</div><canvas id="cv"></canvas>
  <div class="bar" style="margin-top:10px"><button class="btn" id="ok">자르기 완료</button><button class="btn g" id="full">전체 사용</button><button class="btn g" id="no">취소</button></div>`);
  const cv=$('cv');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  let r={x:0,y:0,w:W,h:H},st=null;
  function draw(){x.drawImage(im,0,0,W,H);x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,r.y);x.fillRect(0,r.y+r.h,W,H);x.fillRect(0,r.y,r.x,r.h);x.fillRect(r.x+r.w,r.y,W,r.h);x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(r.x,r.y,r.w,r.h)}
  const pt=e=>{const b=cv.getBoundingClientRect();return{x:Math.max(0,Math.min(W,(e.clientX-b.left)*W/b.width)),y:Math.max(0,Math.min(H,(e.clientY-b.top)*H/b.height))}};
  cv.onpointerdown=e=>{st=pt(e);cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!st)return;const p=pt(e);r={x:Math.min(st.x,p.x),y:Math.min(st.y,p.y),w:Math.abs(p.x-st.x),h:Math.abs(p.y-st.y)};draw()};
  cv.onpointerup=()=>{st=null};
  draw();
  function out(rr){const sw=rr.w/sc,sh=rr.h/sc,o=document.createElement('canvas'),kk=Math.min(1,900/Math.max(sw,sh));o.width=sw*kk;o.height=sh*kk;o.getContext('2d').drawImage(im,rr.x/sc,rr.y/sc,sw,sh,0,0,o.width,o.height);done(o.toDataURL('image/jpeg',.85));hide('m2')}
  $('ok').onclick=()=>r.w>20&&r.h>20?out(r):out({x:0,y:0,w:W,h:H});
  $('full').onclick=()=>out({x:0,y:0,w:W,h:H});
  $('no').onclick=()=>hide('m2');
 };im.src=URL.createObjectURL(file);
}
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(items)],{type:'application/json'}));a.download='closet-backup.json';a.click()};
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const a=JSON.parse(await f.text());a.forEach(o=>{const ix=items.findIndex(x=>x.id===o.id);ix>=0?items[ix]=o:items.push(o);put(o)});render()}catch(err){alert('파일을 읽지 못했어요')}};
let t0=null;
$('m1').addEventListener('touchstart',e=>{if(!mode||e.touches.length!==1||e.target.closest('input,select,textarea'))return t0=null;const t=e.touches[0];t0={x:t.clientX,y:t.clientY,top:$('s1').scrollTop}},{passive:true});
$('m1').addEventListener('touchend',e=>{if(!t0||!mode)return;const t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y,a=t0;t0=null;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){const d=dx<0?1:-1,j=ORDER.indexOf(curId)+d;if(ORDER[j])detail(ORDER[j],d)}
 else if(dy>90&&dy>Math.abs(dx)*1.5&&a.top===0)hide('m1')},{passive:true});
$('m1').onclick=e=>{if(mode&&e.target.id==='m1')hide('m1')};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
open().then(loadAll).then(a=>{items=a;readF()});
</script></body></html>
